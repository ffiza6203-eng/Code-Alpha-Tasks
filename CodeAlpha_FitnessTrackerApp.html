<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Tracker</title>
<style>
  :root{
    --bg:#F2F5F1;
    --panel:#FFFFFF;
    --ink:#1E2A22;
    --ink-soft:#6B786F;
    --rule:#E1E8E0;
    --accent:#3E7A4E;
    --accent-soft:#DFF0E1;
    --steps:#3E7A4E;
    --workout:#C77B3E;
    --cal:#B0532F;
    --danger:#B24B4B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .wrap{ max-width:900px; margin:0 auto; padding:40px 24px 80px; }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:32px;
  }
  h1{ font-size:24px; margin:0; font-weight:700; }
  .today{ color:var(--ink-soft); font-size:14px; }

  .summary-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:28px;
  }
  .stat{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:20px;
  }
  .stat .num{ font-size:30px; font-weight:700; line-height:1.1; }
  .stat .lbl{ color:var(--ink-soft); font-size:13px; margin-top:4px; }
  .stat.steps .num{ color:var(--steps); }
  .stat.workout .num{ color:var(--workout); }
  .stat.cal .num{ color:var(--cal); }

  .progress-track{
    height:8px;
    background:var(--rule);
    border-radius:4px;
    margin-top:12px;
    overflow:hidden;
  }
  .progress-fill{ height:100%; border-radius:4px; transition:width 0.4s ease; }

  .panel{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:24px;
    margin-bottom:24px;
  }
  .panel h2{ font-size:16px; margin:0 0 16px; }

  .chart{ display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
  .bar{ width:100%; max-width:36px; border-radius:4px 4px 0 0; background:var(--steps); transition:height 0.4s ease; min-height:2px; }
  .bar-day{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
  .bar-val{ font-size:11px; color:var(--ink); margin-bottom:4px; font-weight:600; }

  form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:8px;
  }
  form .full{ grid-column:1 / -1; }
  label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:5px; }
  input,select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--rule);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
  }
  input:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  .submit-btn{
    grid-column:1 / -1;
    background:var(--accent);
    color:#fff;
    padding:12px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
  }
  .submit-btn:hover{ background:#2f6140; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--rule); }
  th{ color:var(--ink-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.4px; }
  .del-btn{ background:none; color:var(--danger); font-size:13px; padding:4px 8px; border-radius:4px; }
  .del-btn:hover{ background:#F5E4E4; }
  .empty-row td{ text-align:center; color:var(--ink-soft); font-style:italic; padding:24px; }
  .tag{
    display:inline-block;
    padding:3px 10px;
    border-radius:12px;
    font-size:12px;
    background:var(--accent-soft);
    color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fitness Tracker</h1>
    <span class="today" id="todayLabel"></span>
  </header>

  <div class="summary-grid">
    <div class="stat steps">
      <div class="num" id="stepsToday">0</div>
      <div class="lbl">Steps today (goal 8,000)</div>
      <div class="progress-track"><div class="progress-fill" id="stepsFill" style="background:var(--steps);width:0%"></div></div>
    </div>
    <div class="stat workout">
      <div class="num" id="workoutToday">0m</div>
      <div class="lbl">Workout minutes today (goal 30m)</div>
      <div class="progress-track"><div class="progress-fill" id="workoutFill" style="background:var(--workout);width:0%"></div></div>
    </div>
    <div class="stat cal">
      <div class="num" id="calToday">0</div>
      <div class="lbl">Calories burned today (goal 500)</div>
      <div class="progress-track"><div class="progress-fill" id="calFill" style="background:var(--cal);width:0%"></div></div>
    </div>
  </div>

  <div class="panel">
    <h2>Last 7 days &mdash; steps</h2>
    <div class="chart" id="weekChart"></div>
  </div>

  <div class="panel">
    <h2>Log an activity</h2>
    <form id="logForm">
      <div>
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" required>
      </div>
      <div>
        <label for="typeInput">Exercise type</label>
        <select id="typeInput">
          <option>Walking</option>
          <option>Running</option>
          <option>Cycling</option>
          <option>Gym / Weights</option>
          <option>Yoga</option>
          <option>Swimming</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="stepsInput">Steps</label>
        <input type="number" id="stepsInput" min="0" placeholder="e.g. 5000">
      </div>
      <div>
        <label for="minutesInput">Workout time (minutes)</label>
        <input type="number" id="minutesInput" min="0" placeholder="e.g. 30">
      </div>
      <div class="full">
        <label for="calInput">Calories burned</label>
        <input type="number" id="calInput" min="0" placeholder="e.g. 250">
      </div>
      <button type="submit" class="submit-btn">Add entry</button>
    </form>
  </div>

  <div class="panel">
    <h2>Activity log</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Type</th><th>Steps</th><th>Minutes</th><th>Calories</th><th></th></tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>

<script>
const STORAGE_KEY = 'fitness:entries';
let entries = [];

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  render();
}

async function saveEntries(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    console.error('Could not save entries', e);
  }
}

function render(){
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined,{ weekday:'long', month:'long', day:'numeric' });
  renderSummary();
  renderChart();
  renderTable();
}

function renderSummary(){
  const today = todayStr();
  const todays = entries.filter(e=>e.date===today);
  const steps = todays.reduce((s,e)=>s+(e.steps||0),0);
  const minutes = todays.reduce((s,e)=>s+(e.minutes||0),0);
  const cal = todays.reduce((s,e)=>s+(e.calories||0),0);

  document.getElementById('stepsToday').textContent = steps.toLocaleString();
  document.getElementById('workoutToday').textContent = minutes + 'm';
  document.getElementById('calToday').textContent = cal.toLocaleString();

  document.getElementById('stepsFill').style.width = Math.min(100, steps/8000*100) + '%';
  document.getElementById('workoutFill').style.width = Math.min(100, minutes/30*100) + '%';
  document.getElementById('calFill').style.width = Math.min(100, cal/500*100) + '%';
}

function renderChart(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const totals = days.map(d => entries.filter(e=>e.date===d).reduce((s,e)=>s+(e.steps||0),0));
  const max = Math.max(...totals, 1000);

  const chart = document.getElementById('weekChart');
  chart.innerHTML = days.map((d,i)=>{
    const val = totals[i];
    const h = Math.max(2, (val/max)*120);
    const label = new Date(d + 'T00:00:00').toLocaleDateString(undefined,{ weekday:'short' });
    return `
      <div class="bar-col">
        <div class="bar-val">${val ? val.toLocaleString() : ''}</div>
        <div class="bar" style="height:${h}px"></div>
        <div class="bar-day">${label}</div>
      </div>
    `;
  }).join('');
}

function renderTable(){
  const body = document.getElementById('logBody');
  if(!entries.length){
    body.innerHTML = `<tr class="empty-row"><td colspan="6">No entries yet. Log your first activity above.</td></tr>`;
    return;
  }
  const sorted = [...entries].sort((a,b)=> b.date.localeCompare(a.date));
  body.innerHTML = sorted.map(e => `
    <tr>
      <td>${e.date}</td>
      <td><span class="tag">${e.type}</span></td>
      <td>${e.steps ? e.steps.toLocaleString() : '—'}</td>
      <td>${e.minutes ? e.minutes + 'm' : '—'}</td>
      <td>${e.calories || '—'}</td>
      <td><button class="del-btn" data-id="${e.id}">Delete</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> deleteEntry(btn.dataset.id));
  });
}

async function deleteEntry(id){
  entries = entries.filter(e=>e.id!==id);
  await saveEntries();
  render();
}

document.getElementById('dateInput').value = todayStr();

document.getElementById('logForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const entry = {
    id: crypto.randomUUID(),
    date: document.getElementById('dateInput').value || todayStr(),
    type: document.getElementById('typeInput').value,
    steps: parseInt(document.getElementById('stepsInput').value) || 0,
    minutes: parseInt(document.getElementById('minutesInput').value) || 0,
    calories: parseInt(document.getElementById('calInput').value) || 0
  };
  entries.push(entry);
  await saveEntries();
  e.target.reset();
  document.getElementById('dateInput').value = todayStr();
  render();
});

loadEntries();
</script>
</body>
</html>
